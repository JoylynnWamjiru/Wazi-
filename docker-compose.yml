# Docker Compose — Wazi Development Environment
#
# Start:    docker compose up -d
# Stop:     docker compose down
# Logs:     docker compose logs -f db
# Reset:    docker compose down -v   (WARNING: deletes all data)
# Restart   docker compose restart	 

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: wazi-postgres
    environment:
      POSTGRES_USER: wazi
      POSTGRES_PASSWORD: wazi_password
      POSTGRES_DB: wazi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wazi -d wazi_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
